name: Server management checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/server/tests -v
      - run: python -m unittest discover -s deployment/backup -p 'test_*.py' -v
      - run: python -m compileall -q backend
      - name: Check shell scripts
        run: |
          for file in deployment/termux/*.sh backend/server/termux/*.sh backend/server/termux/boot/*; do bash -n "$file"; done
  atlas-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LMS147/atlas-agent
          path: .integration/atlas-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y runit
      - run: pip install -r backend/requirements.txt -r .integration/atlas-agent/backend/requirements.txt
      - name: Test the separate Atlas checkout
        env:
          ATLAS_TEST_ROOT: ${{ github.workspace }}/.integration/atlas-agent
          ATLAS_PYTHON: python
        run: python -m unittest discover -s backend/server/tests -v
